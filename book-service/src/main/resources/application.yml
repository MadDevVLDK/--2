server.port: 8081

spring:
  application:
    name: book-service
  datasource:
    url: jdbc:h2:file:./data/books;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
      
management:
  endpoints:
    web:
      exposure:
        include: health,info